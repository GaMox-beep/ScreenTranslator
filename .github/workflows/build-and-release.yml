name: Build and Release Single-File Exe

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Publish Single-File Exe
      run: |
        dotnet publish ScreenTranslator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-win-x64
        path: ./publish/ScreenTranslator.exe

    - name: Create or Update GitHub Release
      if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build (Continuous)' }}
        body: |
          Bản build tự động mới nhất của ScreenTranslator (Single-file .exe).
          - Tải file **ScreenTranslator.exe** bên dưới để chạy trực tiếp (không cần cài thêm .NET).
          - Commit: ${{ github.sha }}
        files: ./publish/ScreenTranslator.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
